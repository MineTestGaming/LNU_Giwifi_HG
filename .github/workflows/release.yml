name: Build and Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter pub get
            - run: flutter build apk --release
            - uses: actions/upload-artifact@v4
              with:
                  name: android
                  path: build/app/outputs/flutter-apk/app-release.apk

    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
            - run: flutter config --enable-linux-desktop
            - run: flutter pub get
            - run: flutter build linux --release
            - run: mkdir -p dist && tar -czf dist/LNU-Giwifi-HG-linux-${GITHUB_REF_NAME}.tar.gz -C build/linux/x64/release bundle
            - uses: actions/upload-artifact@v4
              with:
                  name: linux
                  path: dist/*.tar.gz

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter config --enable-windows-desktop
            - run: flutter pub get
            - run: flutter build windows --release
            - run: New-Item -ItemType Directory -Force dist; Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/LNU-Giwifi-HG-windows-${env:GITHUB_REF_NAME}.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: dist/*.zip

    macos:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter config --enable-macos-desktop
            - run: flutter pub get
            - run: flutter build macos --release
            - run: mkdir -p dist && ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app dist/LNU-Giwifi-HG-macos-${GITHUB_REF_NAME}.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: dist/*.zip

    ios:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - run: flutter pub get
            - run: flutter build ios --release --no-codesign
            - run: mkdir -p dist && ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/LNU-Giwifi-HG-ios-unsigned-${GITHUB_REF_NAME}.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: ios-unsigned
                  path: dist/*.zip

    release:
        needs: [android, linux, windows, macos, ios, web]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  generate_release_notes: true
                  files: dist/*
